<!DOCTYPE html>
<html lang="en">
{% include head.html %}
<body>
  <!-- Mobile close button -->
  <button class="sidebar-close d-md-none" id="sidebar-close" aria-label="Close navigation">
    <i class="fas fa-times"></i>
  </button>

  <!-- Mobile overlay -->
  <div class="sidebar-overlay d-md-none" id="sidebar-overlay"></div>

  <div class="container">
    <!-- Mobile sidebar toggle -->
    <div class="sidebar-toggle-wrapper d-md-none" id="sidebar-toggle-wrapper">
      <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Open navigation">
        <i class="fas fa-bars"></i>
        <span class="sidebar-toggle-label">Konstantin Zaremski</span>
      </button>
    </div>

    <div class="row">
      <div class="col-md-5 col-lg-4 sidebar-col" id="sidebar-col">
        {% include sidebar.html %}
      </div>
      <div class="col-md-7 col-lg-8 pt-5 main-content">
        {{ content }}
      </div>
    </div>
  </div>

  {% include footer.html %}
  {% include scroll-to-top.html %}

  <!-- jQuery (required for Bootstrap modals) -->
  <script src="https://code.jquery.com/jquery-3.6.0.slim.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Custom JS -->
  <script src="{{ '/assets/js/scroll-to-top.js' | relative_url }}"></script>
  <script>
  (function() {
    var toggle = document.getElementById('sidebar-toggle');
    var sidebar = document.getElementById('sidebar-col');
    var overlay = document.getElementById('sidebar-overlay');
    if (!toggle || !sidebar || !overlay) return;

    function open() {
      sidebar.classList.add('open');
      overlay.classList.add('open');
      toggle.classList.add('open');
      if (closeBtn) closeBtn.classList.add('open');
    }

    function close() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
      toggle.classList.remove('open');
      if (closeBtn) closeBtn.classList.remove('open');
    }

    var closeBtn = document.getElementById('sidebar-close');

    toggle.addEventListener('click', function() {
      if (sidebar.classList.contains('open')) { close(); } else { open(); }
    });

    overlay.addEventListener('click', close);
    if (closeBtn) closeBtn.addEventListener('click', close);
  })();
  </script>
</body>
</html>
